name: Lint PHP code style issues

on: # zizmor: ignore[concurrency-limits]
  pull_request:
    paths:
      - '**.php'

permissions: {}

jobs:
  lint-php-code-styling: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check PHP code style issues
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
        with:
          testMode: true
          verboseMode: true
