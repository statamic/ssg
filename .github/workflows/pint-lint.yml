name: Lint PHP code style issues

on: # zizmor: ignore[concurrency-limits]
  pull_request:
    paths:
      - '**.php'

permissions: {}

jobs:
  lint-php-code-styling: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          coverage: none
          tools: pint

      - name: Check PHP code style issues
        run: pint --test -v
